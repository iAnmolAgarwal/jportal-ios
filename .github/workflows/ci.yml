name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node build.mjs
      - name: dist/jportal.user.js is up to date
        run: |
          git diff --exit-code dist/jportal.user.js || {
            echo "::error file=dist/jportal.user.js::dist/jportal.user.js is out of date. Run 'node build.mjs' and commit the result."
            exit 1
          }
