name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node build.mjs
      - name: dist/jportal.user.js is up to date
        run: git diff --exit-code dist/jportal.user.js
      - name: tag matches @version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(grep -m1 '@version' dist/jportal.user.js | awk '{print $3}')
          [ "$TAG" = "$VER" ] || { echo "::error::tag v$TAG does not match @version $VER"; exit 1; }
      - name: notes from CHANGELOG.md
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::no CHANGELOG.md section for $GITHUB_REF_NAME"; exit 1; }
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/jportal.user.js --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/jportal.user.js \
              --title "JPortal for iOS $GITHUB_REF_NAME" --notes-file notes.md
          fi
